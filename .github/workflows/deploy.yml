name: Deploy to Personal Server (Clean)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies 
      run: |
        echo "🔧 Fixing dependency lock file sync..."
        rm -f package-lock.json
        npm install --package-lock-only
        
        echo "📦 Installing ALL dependencies (including devDependencies for build)..."
        npm ci
      env:
        REACT_APP_API_URL: https://streamscene.net
        REACT_APP_SERVER_URL: https://streamscene.net
        
    - name: Build application
      run: |
        echo "🏗️ Building application for production..."
        npm run build
      env:
        NODE_ENV: production
        REACT_APP_API_URL: https://streamscene.net
        REACT_APP_SERVER_URL: https://streamscene.net

    - name: Compile TypeScript
      run: |
        echo "📝 Compiling TypeScript..."
        npx tsc --project server/tsconfig.json

    - name: Create deployment package
      run: |
        echo "📦 Creating deployment package..."
        mkdir -p deploy-minimal
        
        # Copy essential files
        cp -r dist/ deploy-minimal/
        cp ecosystem.config.cjs deploy-minimal/
        cp package-server.json deploy-minimal/package.json
        
        # Copy ALL client files from public directory
        echo "📋 Copying all client files..."
        cp -r public/ deploy-minimal/
        
        echo "📋 Files being deployed:"
        ls -la deploy-minimal/public/ | head -20
        
        # Create environment file
        cat > deploy-minimal/.env << EOF
        NODE_ENV=production
        PORT=8000
        CLIENT_URL=https://streamscene.net
        REACT_APP_API_URL=https://streamscene.net
        REACT_APP_SERVER_URL=https://streamscene.net
        BASE_URL=https://streamscene.net
        ALLOW_DEMO_LOGIN=true
        SESSION_SECRET=${{ secrets.SESSION_SECRET }}
        GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
        GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
        AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION=${{ secrets.AWS_REGION }}
        AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}
        GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
        DB_HOST=localhost
        DB_NAME=stream_scene_db
        DB_USER=root
        DB_PASS=StreamRoot2024!
        EOF
        
        # Create package
        cd deploy-minimal
        tar -czf ../deploy.tar.gz .
        cd ..
        
        echo "📤 Package size: $(ls -lh deploy.tar.gz)"

    - name: Test server connectivity
      run: |
        timeout 10 nc -zv ${{ secrets.SERVER_HOST }} ${{ secrets.SERVER_PORT || 22 }} || {
          echo "❌ Cannot connect to server. Check firewall/network."
          exit 1
        }

    - name: Deploy to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        source: "deploy.tar.gz"
        target: "/tmp/"
        
    - name: Extract and restart application
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        timeout: 10m
        command_timeout: 10m
        script: |
          set -e
          
          echo "🔍 Checking uploaded files..."
          ls -la /tmp/deploy.tar.gz || { echo "❌ Deploy file not found"; exit 1; }
          
          echo "🔄 Preparing deployment directory..."
          cd /var/www/stream-scene || { 
            echo "Creating directory..."
            sudo mkdir -p /var/www/stream-scene
            sudo chown $USER:$USER /var/www/stream-scene
            cd /var/www/stream-scene
          }
          
          # Create backup if exists
          if [ -f "package.json" ]; then
            echo "📋 Creating backup..."
            sudo cp -r . ../stream-scene-backup-$(date +%s) 2>/dev/null || echo "Backup skipped"
          fi
          
          # Extract deployment
          echo "📦 Extracting deployment package..."
          tar -xzf /tmp/deploy.tar.gz
          rm -f /tmp/deploy.tar.gz
          
          echo "🔧 Installing production dependencies..."
          npm install --production --silent
          
          echo "🔄 Restarting application with PM2..."
          pm2 restart stream-scene || pm2 start ecosystem.config.cjs --name stream-scene
          pm2 save
          
          echo "✅ Deployment completed successfully!"
          pm2 list
          echo "🌐 Application should be available at: https://streamscene.net"