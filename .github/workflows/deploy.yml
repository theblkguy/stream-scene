name: Deploy to Personal Server

on:
  push:
    branches: [ main ]  # Deploy from main branch
  workflow_dispatch: # Allow manual trigger

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Clean install dependencies
      run: |
        rm -rf node_modules
        npm ci
      
    - name: Build application
      run: |
        npm run build
        
    - name: Create deployment package
      run: |
        # Create a deployment directory
        mkdir -p deploy
        
        # Copy built server files to the root of deploy (since server expects to run from root)
        cp -r dist/server/* deploy/
        
        # Copy built frontend files to public directory (where server expects them)
        mkdir -p deploy/public
        cp dist/*.js deploy/public/ 2>/dev/null || true
        cp dist/*.html deploy/public/ 2>/dev/null || true
        cp dist/*.txt deploy/public/ 2>/dev/null || true
        
        # Copy any existing public assets
        if [ -d "public" ]; then
          cp -r public/* deploy/public/ 2>/dev/null || true
        fi
        
        # Copy configuration files
        cp ecosystem.config.cjs deploy/
        cp package-server.json deploy/package.json
        
        # Create environment file template (will be populated with secrets)
        # Ensure clean file creation
        rm -f deploy/.env
        
        # Create .env file with explicit line endings
        printf "PORT=8000\n" > deploy/.env
        printf "NODE_ENV=production\n" >> deploy/.env
        printf "SESSION_SECRET=%s\n" "${{ secrets.SESSION_SECRET }}" >> deploy/.env
        printf "GOOGLE_CLIENT_ID=%s\n" "${{ secrets.GOOGLE_CLIENT_ID }}" >> deploy/.env
        printf "GOOGLE_CLIENT_SECRET=%s\n" "${{ secrets.GOOGLE_CLIENT_SECRET }}" >> deploy/.env
        printf "GOOGLE_CALLBACK_URL=http://%s:8000/auth/google/callback\n" "${{ secrets.SERVER_HOST }}" >> deploy/.env
        printf "AWS_ACCESS_KEY_ID=%s\n" "${{ secrets.AWS_ACCESS_KEY_ID }}" >> deploy/.env
        printf "AWS_SECRET_ACCESS_KEY=%s\n" "${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> deploy/.env
        printf "AWS_REGION=%s\n" "${{ secrets.AWS_REGION }}" >> deploy/.env
        printf "AWS_S3_BUCKET=%s\n" "${{ secrets.AWS_S3_BUCKET }}" >> deploy/.env
        printf "DB_HOST=%s\n" "${{ secrets.DB_HOST }}" >> deploy/.env
        printf "DB_NAME=%s\n" "${{ secrets.DB_NAME }}" >> deploy/.env
        printf "DB_USER=%s\n" "${{ secrets.DB_USER }}" >> deploy/.env
        printf "DB_PASS=%s\n" "${{ secrets.DB_PASS }}" >> deploy/.env
        
        # Verify file was created properly
        echo "=== .env file validation ==="
        echo "File size: $(wc -l < deploy/.env) lines"
        echo "File exists: $([ -f deploy/.env ] && echo 'yes' || echo 'no')"
        
        # Debug: Show the .env file contents (mask sensitive values)
        echo "=== .env file created ==="
        cat deploy/.env | sed 's/=.*$/=***MASKED***/'
        echo "========================="
        
        # Debug: Check if secrets are actually populated
        echo "=== Secrets Check ==="
        echo "DB_HOST is set: ${{ secrets.DB_HOST != '' }}"
        echo "DB_USER is set: ${{ secrets.DB_USER != '' }}"
        echo "DB_PASS is set: ${{ secrets.DB_PASS != '' }}"
        echo "SESSION_SECRET is set: ${{ secrets.SESSION_SECRET != '' }}"
        echo "===================="

    - name: Setup server directory
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          # Create app directory if it doesn't exist
          sudo mkdir -p /var/www/stream-scene
          sudo chown $USER:$USER /var/www/stream-scene
          
          # Create logs directory
          mkdir -p /var/www/stream-scene/logs

    - name: Copy files to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        source: "deploy/*"
        target: "/var/www/stream-scene/"
        strip_components: 1
        
    - name: Deploy application
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          cd /var/www/stream-scene
          
          # Check PM2 availability
          echo "PM2 version: $(pm2 --version)"
          
          # Clear Node.js cache and PM2 cache
          echo "Clearing caches..."
          pm2 flush
          npm cache clean --force
          
          # Install production dependencies
          npm install --production
          
          # Stop and remove existing PM2 process completely
          echo "Stopping and removing existing stream-scene process..."
          pm2 stop stream-scene 2>/dev/null || echo "No existing process to stop"
          pm2 delete stream-scene 2>/dev/null || echo "No existing process to delete"
          
          # Clear any lingering PM2 processes with similar names
          pm2 delete all 2>/dev/null || echo "No processes to clear"
          
          # Debug: Show what files are actually on the server
          echo "=== Server Debug Info ==="
          echo "Current directory: $(pwd)"
          echo "Files in /var/www/stream-scene:"
          ls -la /var/www/stream-scene/
          echo "Contents of .env file (first 5 lines, masked):"
          head -5 /var/www/stream-scene/.env | sed 's/=.*$/=***MASKED***/' 2>/dev/null || echo "No .env file found"
          echo "========================="
          
          # Start fresh PM2 process using ecosystem config
          echo "Starting new stream-scene process..."
          
          pm2 start ecosystem.config.cjs --env production
          
          # Wait for the process to start and show immediate logs
          sleep 3
          echo "=== Immediate startup logs ==="
          pm2 logs stream-scene --lines 50 --nostream || echo "No logs available yet"
          
          # Save PM2 configuration for auto-restart on reboot
          pm2 save
          
          # Show current PM2 status
          echo "Current PM2 processes:"
          pm2 status
          
          # Force a complete restart to ensure new code is loaded
          echo "Force restarting to ensure new code is loaded..."
          pm2 restart stream-scene --update-env || echo "Process restart failed"
          
          # Wait a moment for startup
          sleep 3
          
          # Show logs for verification
          echo "Recent logs:"
          pm2 logs stream-scene --lines 20 --nostream || echo "No logs available yet"
