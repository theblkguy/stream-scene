name: Deploy to Personal Server (Simplified)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies 
      run: |
        echo "🔧 Fixing dependency lock file sync..."
        rm -f package-lock.json
        npm install --package-lock-only
        
        echo "📦 Installing ALL dependencies (including devDependencies for build)..."
        # Install with devDependencies for webpack build tools
        npm ci
      env:
        # Don't set NODE_ENV=production during install to get devDependencies
        REACT_APP_API_URL: https://streamscene.net
        REACT_APP_SERVER_URL: https://streamscene.net
        
    - name: Build application
      run: |
        echo "🏗️ Building application for production..."
        npm run build || {
          echo "❌ Build failed. Debugging information:"
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          echo "Available memory: $(free -m | grep '^Mem:' | awk '{print $7}')MB"
          echo "Webpack config exists: $(test -f webpack.config.mjs && echo 'Yes' || echo 'No')"
          echo "html-webpack-plugin installed: $(npm list html-webpack-plugin --depth=0 | grep html-webpack-plugin || echo 'Not found')"
          echo "DevDependencies installed: $(npm list --depth=0 | grep -E '(webpack|html-webpack-plugin)' || echo 'None found')"
          exit 1
        }
      env:
        NODE_ENV: production
        REACT_APP_API_URL: https://streamscene.net
        REACT_APP_SERVER_URL: https://streamscene.net

    - name: Compile TypeScript
      run: |
        echo "📝 Compiling TypeScript..."
        # TypeScript should already be installed from package.json
        npx tsc --project server/tsconfig.json || {
          echo "❌ TypeScript compilation failed"
          echo "Installing TypeScript as fallback..."
          npm install typescript --save-dev
          npx tsc --project server/tsconfig.json
        }

    - name: Create minimal deployment package
      run: |
        echo "📦 Creating minimal deployment package..."
        mkdir -p deploy-minimal
        
        # Copy only essential files
        cp -r dist/ deploy-minimal/
        cp ecosystem.config.cjs deploy-minimal/
        cp package-server.json deploy-minimal/package.json
        
        # Create minimal client
        mkdir -p deploy-minimal/public
        cp public/index.html deploy-minimal/public/
        cp public/*.bundle.js deploy-minimal/public/ 2>/dev/null || echo "No bundles found"
        
        # Create environment file
        cat > deploy-minimal/.env << EOF
        NODE_ENV=production
        PORT=8000
        CLIENT_URL=https://streamscene.net
        REACT_APP_API_URL=https://streamscene.net
        REACT_APP_SERVER_URL=https://streamscene.net
        BASE_URL=https://streamscene.net
        ALLOW_DEMO_LOGIN=true
        SESSION_SECRET=${{ secrets.SESSION_SECRET }}
        GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
        GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
        AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION=${{ secrets.AWS_REGION }}
        AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}
        GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
        DB_HOST=localhost
        DB_NAME=stream_scene_db
        DB_USER=root
        DB_PASS=StreamRoot2024!
        EOF
        
        # Create compressed package
        cd deploy-minimal
        tar -czf ../deploy.tar.gz .
        cd ..
        
        echo "📤 Final package size: $(ls -lh deploy.tar.gz)"

    - name: Test server connectivity
      run: |
        timeout 10 nc -zv ${{ secrets.SERVER_HOST }} ${{ secrets.SERVER_PORT || 22 }} || {
          echo "❌ Cannot connect to server. Check firewall/network."
          exit 1
        }

    - name: Setup SSH for deployment
      run: |
        echo "🔑 Setting up SSH key for deployment..."
        mkdir -p ~/.ssh
        echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        
        # Test connection
        ssh-keyscan -p ${{ secrets.SERVER_PORT || 22 }} ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts || echo "Host key scan failed, continuing..."
        
    - name: Deploy via rsync with timeout and fallback
      run: |
        echo "📦 Deploying via rsync..."
        echo "Package size: $(ls -lh deploy.tar.gz | awk '{print $5}')"
        
        # Test SSH connectivity first
        echo "🔍 Testing SSH connectivity..."
        timeout 30 ssh -i ~/.ssh/deploy_key \
          -p ${{ secrets.SERVER_PORT || 22 }} \
          -o StrictHostKeyChecking=no \
          -o ConnectTimeout=15 \
          -o ServerAliveInterval=5 \
          -o ServerAliveCountMax=3 \
          ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
          "echo 'SSH connection successful'" || {
            echo "❌ SSH connectivity test failed"
            echo "Trying alternative connection methods..."
          }
        
        # Try rsync with timeout and verbose output
        echo "📦 Starting rsync transfer..."
        timeout 300 rsync -avz --timeout=60 --progress \
          -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SERVER_PORT || 22 }} -o StrictHostKeyChecking=no -o ConnectTimeout=30" \
          deploy.tar.gz \
          ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/streamscene-deploy.tar.gz || {
            echo "❌ Rsync failed, trying direct SCP with timeout..."
            timeout 180 scp -i ~/.ssh/deploy_key \
              -P ${{ secrets.SERVER_PORT || 22 }} \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 \
              -o ServerAliveInterval=10 \
              deploy.tar.gz \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/streamscene-deploy.tar.gz
          }
          
        echo "✅ File transfer completed"
        
    - name: Extract and restart application
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        timeout: 5m
        command_timeout: 5m
        script: |
          set -e
          
          echo "� Extracting deployment package..."
          cd /var/www/stream-scene
          
          # Backup current deployment
          if [ -f "package.json" ]; then
            echo "📋 Creating backup..."
            cp -r . ../stream-scene-backup-$(date +%s) || echo "Backup failed, continuing..."
          fi
          
          # Extract new deployment
          tar -xzf /tmp/streamscene-deploy.tar.gz
          rm -f /tmp/streamscene-deploy.tar.gz
          
          echo "� Installing production dependencies..."
          npm install --production --silent
          
          echo "🔄 Restarting application with PM2..."
          pm2 stop stream-scene || echo "No existing process to stop"
          pm2 start ecosystem.config.cjs --env production --name stream-scene
          pm2 save
          
          echo "✅ Deployment completed successfully!"
          pm2 list
          echo "🌐 Application should be available at: https://streamscene.net"
    
    - name: Transfer deployment file
      run: |
        echo "📦 Encoding deployment package for SSH transfer..."
        base64 deploy.tar.gz > deploy.tar.gz.b64
        echo "📤 Deployment package size: $(ls -lh deploy.tar.gz | awk '{print $5}')"
        echo "📤 Encoded size: $(ls -lh deploy.tar.gz.b64 | awk '{print $5}')"
        
        # Split the base64 file into chunks for reliable transfer
        split -b 1M deploy.tar.gz.b64 deploy_chunk_
        echo "📦 Created $(ls deploy_chunk_* | wc -l) chunks for transfer"
        
    - name: Deploy via chunked SSH transfer
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        timeout: 15m
        command_timeout: 15m
        script: |
          set -e
          
          echo "� Preparing deployment directory..."
          rm -rf /tmp/streamscene-deploy
          mkdir -p /tmp/streamscene-deploy
          cd /tmp/streamscene-deploy
          
          # This will be filled by the next step
          echo "📥 Ready to receive deployment chunks..."
          
    - name: Transfer and deploy
      run: |
        echo "🔄 Transferring deployment via SSH..."
        
        # Create a deployment script that includes the base64 data
        cat > deploy_script.sh << 'DEPLOY_SCRIPT_EOF'
        #!/bin/bash
        set -e
        
        echo "📥 Creating deployment package on server..."
        cd /tmp/streamscene-deploy
        
        # Receive base64 encoded deployment
        cat > deploy.tar.gz.b64 << 'B64_EOF'
        $(cat deploy.tar.gz.b64)
        B64_EOF
        
        echo "📦 Decoding deployment package..."
        base64 -d deploy.tar.gz.b64 > deploy.tar.gz
        rm deploy.tar.gz.b64
        
        echo "📤 Package size: $(ls -lh deploy.tar.gz | awk '{print $5}')"
        
        echo "🔄 Extracting to application directory..."
        cd /var/www/stream-scene
        tar -xzf /tmp/streamscene-deploy/deploy.tar.gz
        rm -rf /tmp/streamscene-deploy
        
        echo "📦 Installing production dependencies..."
        npm install --production --silent
        
        echo "🔄 Restarting application..."
        pm2 restart stream-scene || pm2 start ecosystem.config.cjs --env production
        pm2 save
        
        echo "✅ Deployment completed successfully!"
        pm2 status
        DEPLOY_SCRIPT_EOF
        
        # Transfer and execute the deployment script
        scp -i <(echo "${{ secrets.SERVER_SSH_KEY }}") \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -P ${{ secrets.SERVER_PORT || 22 }} \
            deploy_script.sh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/
            
        ssh -i <(echo "${{ secrets.SERVER_SSH_KEY }}") \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -p ${{ secrets.SERVER_PORT || 22 }} \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "bash /tmp/deploy_script.sh && rm /tmp/deploy_script.sh"