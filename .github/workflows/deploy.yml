name: Deploy to Personal Server

on:
  push:
    branches: [ live-branch ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Clean install dependencies
        run: |
          rm -rf node_modules
          npm ci

      - name: Build client (production)
        run: npm run build:client:prod

      - name: Build server
        run: npm run build:server

      - name: Create deployment package
        run: |
          mkdir -p deploy
          cp -a dist/. deploy/
          cp dist/index.html deploy/index.html
          cp ecosystem.config.cjs deploy/
          cp package-server.json deploy/package.json
          rm -f deploy/.env
          printf "PORT=8000\n" > deploy/.env
          printf "NODE_ENV=production\n" >> deploy/.env
          printf "SESSION_SECRET=%s\n" "${{ secrets.SESSION_SECRET }}" >> deploy/.env
          printf "GOOGLE_CLIENT_ID=%s\n" "${{ secrets.GOOGLE_CLIENT_ID }}" >> deploy/.env
          printf "GOOGLE_CLIENT_SECRET=%s\n" "${{ secrets.GOOGLE_CLIENT_SECRET }}" >> deploy/.env
          printf "GOOGLE_CALLBACK_URL=http://%s:8000/auth/google/callback\n" "${{ secrets.SERVER_HOST }}" >> deploy/.env
          printf "AWS_ACCESS_KEY_ID=%s\n" "${{ secrets.AWS_ACCESS_KEY_ID }}" >> deploy/.env
          printf "AWS_SECRET_ACCESS_KEY=%s\n" "${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> deploy/.env
          printf "AWS_REGION=%s\n" "${{ secrets.AWS_REGION }}" >> deploy/.env
          printf "AWS_S3_BUCKET=%s\n" "${{ secrets.AWS_S3_BUCKET }}" >> deploy/.env
          printf "DB_HOST=%s\n" "${{ secrets.DB_HOST }}" >> deploy/.env
          printf "DB_NAME=%s\n" "${{ secrets.DB_NAME }}" >> deploy/.env
          printf "DB_USER=%s\n" "${{ secrets.DB_USER }}" >> deploy/.env
          printf "DB_PASS=%s\n" "${{ secrets.DB_PASS }}" >> deploy/.env

      - name: Setup server directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            sudo mkdir -p /var/www/stream-scene
            sudo chown $USER:$USER /var/www/stream-scene
            if ! command -v pm2 &> /dev/null; then
              sudo npm install -g pm2
            fi
            mkdir -p /var/www/stream-scene/logs

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "deploy/**"
          target: "/var/www/stream-scene/"
          strip_components: 1

      - name: Before verify
        run: echo "Before verify step"

      - name: Verify deployed files
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo "=== VERIFYING DEPLOYED FILES ==="
            ls -l /var/www/stream-scene/dist/
            echo "=== app.js timestamp ==="
            stat /var/www/stream-scene/dist/server/app.js || echo "app.js missing"
            echo "=== bundle.js timestamp ==="
            stat /var/www/stream-scene/dist/bundle.js || echo "bundle.js missing"
            echo "=== bundle.js head ==="
            head -20 /var/www/stream-scene/dist/bundle.js || echo "bundle.js not found"

      - name: After verify
        run: echo "After verify step"

      - name: Deploy application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd /var/www/stream-scene
            npm install --production
            pm2 stop stream-scene || true
            pm2 delete stream-scene || true
            pm2 start ecosystem.config.cjs --env production
            pm2 save

      - name: Copy index.html to root after upload
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            sudo cp /var/www/stream-scene/dist/index.html /var/www/stream-scene/index.html
