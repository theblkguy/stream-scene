name: Deploy to Personal Server

on:
  push:
    branches: [ main ]  # Deploy from main branch
  workflow_dispatch: # Allow manual trigger

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Clean install dependencies
      run: |
        rm -rf node_modules
        npm ci
      
    - name: Build application
      run: |
        npm run build
        
    - name: Create deployment package
      run: |
        # Create a deployment directory
        mkdir -p deploy
        
        # Copy built server files to the root of deploy (since server expects to run from root)
        cp -r dist/server/* deploy/
        
        # Copy built frontend files to public directory (where server expects them)
        mkdir -p deploy/public
        cp dist/*.js deploy/public/ 2>/dev/null || true
        cp dist/*.html deploy/public/ 2>/dev/null || true
        cp dist/*.txt deploy/public/ 2>/dev/null || true
        
        # Copy any existing public assets
        if [ -d "public" ]; then
          cp -r public/* deploy/public/ 2>/dev/null || true
        fi
        
        # Copy configuration files
        cp ecosystem.config.cjs deploy/
        cp package-server.json deploy/package.json
        
        # Create environment file template (will be populated with secrets)
        # Ensure clean file creation
        rm -f deploy/.env
        
        # Create .env file with explicit line endings
        printf "PORT=8000\n" > deploy/.env
        printf "NODE_ENV=production\n" >> deploy/.env
        printf "SESSION_SECRET=%s\n" "${{ secrets.SESSION_SECRET }}" >> deploy/.env
        printf "GOOGLE_CLIENT_ID=%s\n" "${{ secrets.GOOGLE_CLIENT_ID }}" >> deploy/.env
        printf "GOOGLE_CLIENT_SECRET=%s\n" "${{ secrets.GOOGLE_CLIENT_SECRET }}" >> deploy/.env
        printf "GOOGLE_CALLBACK_URL=http://%s:8000/auth/google/callback\n" "${{ secrets.SERVER_HOST }}" >> deploy/.env
        printf "AWS_ACCESS_KEY_ID=%s\n" "${{ secrets.AWS_ACCESS_KEY_ID }}" >> deploy/.env
        printf "AWS_SECRET_ACCESS_KEY=%s\n" "${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> deploy/.env
        printf "AWS_REGION=%s\n" "${{ secrets.AWS_REGION }}" >> deploy/.env
        printf "AWS_S3_BUCKET=%s\n" "${{ secrets.AWS_S3_BUCKET }}" >> deploy/.env
        printf "DB_HOST=%s\n" "${{ secrets.DB_HOST }}" >> deploy/.env
        printf "DB_NAME=%s\n" "${{ secrets.DB_NAME }}" >> deploy/.env
        printf "DB_USER=%s\n" "${{ secrets.DB_USER }}" >> deploy/.env
        printf "DB_PASS=%s\n" "${{ secrets.DB_PASS }}" >> deploy/.env

    - name: Setup server directory
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          # Create app directory if it doesn't exist
          sudo mkdir -p /var/www/stream-scene
          sudo chown $USER:$USER /var/www/stream-scene
          
          # Create logs directory
          mkdir -p /var/www/stream-scene/logs

    - name: Copy files to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        source: "deploy/*"
        target: "/var/www/stream-scene/"
        strip_components: 1
        
    - name: Deploy application
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          cd /var/www/stream-scene
          
          # Install production dependencies
          npm install --production
          
          # Restart the application
          pm2 restart stream-scene || pm2 start ecosystem.config.cjs --env production
          
          # Save PM2 configuration
          pm2 save
